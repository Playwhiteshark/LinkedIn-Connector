name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
